databases:
  - name: inventario-db
    region: virginia
    plan: free
    databaseName: inventario
    user: inventario

services:
  - type: web
    name: inventario-django
    runtime: python
    region: virginia
    plan: free
    buildCommand: bash build.sh
    startCommand: bash start.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventario-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://proyecto-final-electiva-i.onrender.com"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
