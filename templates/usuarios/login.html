{% extends 'base.html' %}

{% block title %}Iniciar sesion{% endblock %}

{% block layout %}
<main class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <h1 class="h3 text-center mb-2">Sistema de Gestion de Inventario</h1>
                    <p class="text-center text-muted mb-4">Inicia sesion para continuar</p>

                    {% if form.errors %}
                        <div class="alert alert-danger" role="alert">
                            Usuario o contrasena incorrectos.
                        </div>
                    {% endif %}

                    <form method="post" novalidate>
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="{{ form.username.id_for_label }}" class="form-label">Usuario</label>
                            <input
                                type="text"
                                name="{{ form.username.html_name }}"
                                id="{{ form.username.id_for_label }}"
                                class="form-control"
                                autocomplete="username"
                                required
                            >
                        </div>

                        <div class="mb-4">
                            <label for="{{ form.password.id_for_label }}" class="form-label">Contrasena</label>
                            <input
                                type="password"
                                name="{{ form.password.html_name }}"
                                id="{{ form.password.id_for_label }}"
                                class="form-control"
                                autocomplete="current-password"
                                required
                            >
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
                    </form>

                    <p class="text-center text-muted mt-4 mb-0">
                        No tienes cuenta?
                        <a href="{% url 'register' %}">Registrate</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}
