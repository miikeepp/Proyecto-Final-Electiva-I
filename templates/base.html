<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sistema de Gestion de Inventario{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }

        .sidebar {
            min-height: calc(100vh - 56px);
            background-color: #212529;
        }

        .sidebar .nav-link {
            color: #ced4da;
            border-radius: 6px;
            margin-bottom: 4px;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: #ffffff;
            background-color: #0d6efd;
        }

        .content-wrapper {
            min-height: calc(100vh - 56px);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-semibold" href="{% url 'dashboard' %}">
                Sistema de Gestion de Inventario
            </a>

            {% if user.is_authenticated %}
                <div class="d-flex align-items-center gap-3 text-white">
                    <span class="small">{{ user.username }}</span>
                    <form action="{% url 'logout' %}" method="post" class="m-0">
                        {% csrf_token %}
                        <button class="btn btn-outline-light btn-sm" type="submit">Cerrar sesion</button>
                    </form>
                </div>
            {% endif %}
        </div>
    </nav>

    {% block layout %}
        <main class="container py-4">
            {% block content %}{% endblock %}
        </main>
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
