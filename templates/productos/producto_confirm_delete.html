{% extends 'base.html' %}

{% block title %}Desactivar producto{% endblock %}

{% block content %}
<section class="bg-white border rounded p-4">
    <h1 class="h3 mb-3">Desactivar producto</h1>
    <p>El producto <strong>{{ producto.nombre }}</strong> quedara inactivo en el sistema.</p>

    <form method="post" class="d-flex justify-content-end gap-2 mt-4">
        {% csrf_token %}
        <a class="btn btn-outline-secondary" href="{% url 'productos:producto_list' %}">Cancelar</a>
        <button class="btn btn-danger" type="submit">Desactivar</button>
    </form>
</section>
{% endblock %}
